const { useState, useEffect, useMemo, useRef } = React;

/* ---- lucide icon adapter: renders from window.lucide.icons data (no lucide-react needed) ---- */
function makeIcon(name) {
  return function LucideIconCmp({ size = 16, color, strokeWidth = 2, style, ...rest }) {
    const data = window.lucide && window.lucide.icons && window.lucide.icons[name];
    if (!data) return null;
    const children = data.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }));
    return React.createElement('svg', {
      width: size, height: size, viewBox: '0 0 24 24', fill: 'none',
      stroke: color || 'currentColor', strokeWidth, strokeLinecap: 'round', strokeLinejoin: 'round',
      style: { flexShrink: 0, ...style }, ...rest
    }, children);
  };
}
const ICON_NAMES = [
  'LayoutDashboard', 'Landmark', 'ArrowLeftRight', 'CreditCard', 'Receipt', 'PieChart',
  'Settings', 'Bell', 'Search', 'Eye', 'EyeOff', 'Send', 'ArrowUpRight', 'ArrowDownLeft',
  'Lock', 'Unlock', 'Plus', 'X', 'Check', 'ChevronRight', 'LogOut', 'Download', 'Filter', 'User', 'Shield',
  'Smartphone', 'Mail', 'ChevronDown', 'Wallet', 'TrendingUp', 'TrendingDown', 'Menu', 'Snowflake',
  'AlertTriangle', 'CheckCircle2', 'Info', 'ArrowRight', 'Copy', 'MoreHorizontal',
  'FileText', 'HelpCircle', 'MessageSquare', 'Target', 'Gauge', 'ChevronUp', 'Fingerprint',
];
const ICONS = {};
ICON_NAMES.forEach(n => { ICONS[n] = makeIcon(n); });
const {
  LayoutDashboard, Landmark, ArrowLeftRight, CreditCard, Receipt,
  Bell, Search, Eye, EyeOff, Send, ArrowUpRight, ArrowDownLeft,
  Lock, Unlock, Plus, X, Check, ChevronRight, LogOut, Download, Filter, User, Shield,
  Smartphone, Mail, ChevronDown, Wallet, TrendingUp, TrendingDown, Menu, Snowflake,
  AlertTriangle, CheckCircle2, Info, ArrowRight, Copy, MoreHorizontal,
  FileText, HelpCircle, MessageSquare, Target, Gauge, ChevronUp, Fingerprint,
} = ICONS;
const PieIcon = ICONS.PieChart;
const SettingsIcon = ICONS.Settings;

/* ============================== STYLES ============================== */
const STYLES = `
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

.mb-app {
  --ink: #0B1220;
  --surface: #121C30;
  --surface-2: #1A2740;
  --surface-3: #24365A;
  --hairline: rgba(255,255,255,0.09);
  --hairline-strong: rgba(255,255,255,0.16);
  --text: #F2F4F8;
  --text-muted: #90999E60;
  --muted: #8D97B0;

  --brass-bright: #E4C583;
  --teal: #45BE94;
  --coral: #E27467;
  --shadow: 0 20px 50px -25px rgba(0,0,0,0.6);
  --radius: 16px;
  font-family: 'Inter', sans-serif;
  background: var(--ink);
  color: var(--text);
  min-height: 100vh;
  width: 100%;
  position: relative;
  -webkit-font-smoothing: antialiased;
}
.mb-app[data-theme="light"] {
  --ink: #EEF1F6;
  --surface: #FFFFFF;
  --surface-2: #F5F7FB;
  --surface-3: #E9EDF5;
  --hairline: rgba(16,24,38,0.09);
  --hairline-strong: rgba(16,24,38,0.16);

}

.mb-app :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ---------- shell ---------- */
.mb-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.mb-sidebar {
  border-right: 1px solid var(--hairline);

}

.mb-nav { display: flex; flex-direction: column; gap: 3px; }

.mb-sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

}
.mb-switch { width: 34px; height: 19px; border-radius: 99px; background: var(--surface-3); position: relative; border: 1px solid var(--hairline-strong); flex-shrink: 0; transition: background .15s; }

/* ---------- main / topbar ---------- */

.mb-content { padding: 32px 36px 80px; max-width: 1200px; }

/* ---------- ledger rule (signature motif) ---------- */

/* buttons */
.mb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 600; border: 1px solid transparent; transition: opacity .15s, transform .1s; }

/* forms */
.mb-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }

/* progress */
.mb-progress { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }

/* toggle switch generic (reuse mb-switch) */

/* bank card visual */

function money(n, hide) {
  if (hide) return '••••••';
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function useCountUp(target, duration = 800) {
  const [val, setVal] = useState(0);
  const raf = useRef(null);
  useEffect(() => {
    const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { setVal(target); return; }
    const start = performance.now();
    const from = 0;
    function tick(now) {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(from + (target - from) * eased);
      if (p < 1) raf.current = requestAnimationFrame(tick);
    }
    raf.current = requestAnimationFrame(tick);
    return () => raf.current && cancelAnimationFrame(raf.current);
  }, [target, duration]);
  return val;
}
function uid() { return Math.random().toString(36).slice(2, 10); }

/* ============================== MINI CHARTS (no external chart lib) ============================== */
function MiniAreaChart({ data }) {
  const w = 560, h = 220, padL = 34, padR = 8, padT = 10, padB = 22;
  const max = Math.max(...data.map(d => Math.max(d.income, d.spending))) * 1.1;
  const x = i => padL + (i / (data.length - 1)) * (w - padL - padR);
  const y = v => padT + (1 - v / max) * (h - padT - padB);
  const line = key => data.map((d, i) => (i === 0 ? 'M' : 'L') + x(i) + ' ' + y(d[key])).join(' ');
  const area = key => line(key) + ` L ${x(data.length - 1)} ${h - padB} L ${x(0)} ${h - padB} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="100%" preserveAspectRatio="none">
      <defs>
        <linearGradient id="incomeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#45BE94" stopOpacity="0.35" />
          <stop offset="100%" stopColor="#45BE94" stopOpacity="0" />
        </linearGradient>
        <linearGradient id="spendGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#E27467" stopOpacity="0.3" />
          <stop offset="100%" stopColor="#E27467" stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0, 0.5, 1].map(f => (
        <line key={f} x1={padL} x2={w - padR} y1={padT + f * (h - padT - padB)} y2={padT + f * (h - padT - padB)} stroke="var(--hairline)" strokeWidth="1" />
      ))}
      <path d={area('income')} fill="url(#incomeGrad)" />
      <path d={area('spending')} fill="url(#spendGrad)" />
      <path d={line('income')} fill="none" stroke="#45BE94" strokeWidth="2" />
      <path d={line('spending')} fill="none" stroke="#E27467" strokeWidth="2" />
      {data.map((d, i) => (
        <text key={i} x={x(i)} y={h - 4} fontSize="10.5" fill="var(--muted)" textAnchor="middle">{d.month}</text>
      ))}
    </svg>
  );
}

function MiniBarChart({ data }) {
  const w = 560, h = 240, padL = 34, padR = 8, padT = 10, padB = 22;
  const max = Math.max(...data.map(d => Math.max(d.income, d.spending))) * 1.15;
  const groupW = (w - padL - padR) / data.length;
  const barW = groupW * 0.3;
  const y = v => padT + (1 - v / max) * (h - padT - padB);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="100%" preserveAspectRatio="none">
      {[0, 0.5, 1].map(f => (
        <line key={f} x1={padL} x2={w - padR} y1={padT + f * (h - padT - padB)} y2={padT + f * (h - padT - padB)} stroke="var(--hairline)" strokeWidth="1" />
      ))}
      {data.map((d, i) => {
        const gx = padL + i * groupW + groupW / 2;
        return (
          <g key={i}>
            <rect x={gx - barW - 2} y={y(d.income)} width={barW} height={(h - padB) - y(d.income)} fill="#45BE94" rx="2" />
            <rect x={gx + 2} y={y(d.spending)} width={barW} height={(h - padB) - y(d.spending)} fill="#E27467" rx="2" />
            <text x={gx} y={h - 4} fontSize="10.5" fill="var(--muted)" textAnchor="middle">{d.month}</text>
          </g>
        );
      })}
    </svg>
  );
}

function MiniDonut({ data }) {
  const size = 200, cx = size / 2, cy = size / 2, rOuter = 90, rInner = 55;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  let angle = -90;
  const arcs = data.map(d => {
    const sweep = (d.value / total) * 360;
    const start = angle;
    const end = angle + sweep - 2;
    angle += sweep;
    const toXY = (a, r) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
    const [x1, y1] = toXY(start, rOuter), [x2, y2] = toXY(end, rOuter);
    const [x3, y3] = toXY(end, rInner), [x4, y4] = toXY(start, rInner);
    const large = (end - start) > 180 ? 1 : 0;
    const path = `M ${x1} ${y1} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 ${large} 0 ${x4} ${y4} Z`;
    return { path, color: CATEGORY_COLORS[d.name] || '#888', name: d.name };
  });
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width="100%" height="100%" style={{ maxWidth: 220, display: 'block', margin: '0 auto' }}>
      {arcs.map((a, i) => <path key={i} d={a.path} fill={a.color} stroke="var(--surface)" strokeWidth="2" />)}
    </svg>
  );
}

function TransactionsPage({ transactions, accounts, initialFilter }) {
  const [account, setAccount] = useState(initialFilter || 'all');
  const [category, setCategory] = useState('all');
  const [search, setSearch] = useState('');

  const filtered = transactions.filter(t =>
    (account === 'all' || t.accountId === account) &&
    (category === 'all' || t.category === category) &&
    (search === '' || t.merchant.toLowerCase().includes(search.toLowerCase()))
  );

  function exportCSV() {
    const rows = [['Date', 'Merchant', 'Category', 'Account', 'Amount', 'Status']];
    filtered.forEach(t => rows.push([t.date, t.merchant, t.category, t.accountId, t.amount, t.status]));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'meridian-transactions.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  const categories = Array.from(new Set(transactions.map(t => t.category)));

  return (
    <div>
      <div className="mb-section-head mb-mb-16">
        <h2 style={{ fontSize: 20 }}>Transactions</h2>

function TransfersPage({ accounts, doTransfer, doP2P }) {
  const [mode, setMode] = useState('internal');
  const [from, setFrom] = useState(accounts[0].id);
  const [to, setTo] = useState(accounts[1].id);
  const [amount, setAmount] = useState('');
  const [memo, setMemo] = useState('');
  const [recipient, setRecipient] = useState('');
  const [recipientContact, setRecipientContact] = useState('');
  const [step, setStep] = useState('form');
  const [error, setError] = useState('');

  const fromAcct = accounts.find(a => a.id === from);
  const availableToAccounts = accounts.filter(a => a.id !== from && a.type !== 'credit');

  function review(e) {
    e.preventDefault();
    const amt = parseFloat(amount);
    if (!amt || amt <= 0) { setError('Enter an amount greater than $0.'); return; }
    if (mode === 'internal' && from === to) { setError('Choose two different accounts.'); return; }
    if (amt > fromAcct.balance) { setError('That exceeds the available balance on this account.'); return; }
    if (mode === 'p2p' && !recipient) { setError('Enter a recipient name.'); return; }
    setError('');
    setStep('review');
  }

  function confirm() {
    const amt = parseFloat(amount);
    if (mode === 'internal') doTransfer(from, to, amt, memo);
    else doP2P(from, recipient, amt, memo);
    setStep('success');
  }

  function reset() {
    setAmount(''); setMemo(''); setRecipient(''); setRecipientContact(''); setStep('form'); setError('');
  }

  return (
    <div>

function BudgetPage({ transactions }) {
  const spentByCat = useMemo(() => {
    const m = {};
    transactions.forEach(t => { if (t.amount < 0) m[t.category] = (m[t.category] || 0) + Math.abs(t.amount); });
    return m;
  }, [transactions]);

  const pieData = Object.entries(spentByCat).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  const budgets = Object.entries(BUDGET_LIMITS).map(([cat, limit]) => ({ cat, limit, spent: spentByCat[cat] || 0 }));
  const overBudget = budgets.find(b => b.spent > b.limit);

  return (
    <div>
      <div className="mb-section-head mb-mb-16"><h2 style={{ fontSize: 20 }}>Budget & analytics</h2></div>

            {pieData.map(p => (
              <span key={p.name} className="mb-flex mb-gap-8"><CategoryDot cat={p.name} />{p.name}<span className="mb-muted num" style={{ marginLeft: 'auto' }}>{money(p.value)}</span></span>
            ))}
          </div>
        </div>

          <div style={{ height: 240 }}>
            <MiniBarChart data={TREND} />
          </div>
        </div>
      </div>

      {overBudget && (
        <div className="mb-card mb-mb-24" style={{ borderColor: 'color-mix(in srgb, var(--coral) 40%, transparent)' }}>
          <div className="mb-flex mb-gap-12">
            <AlertTriangle size={18} color="var(--coral)" />
            <div style={{ fontSize: 13 }}>You're {money(overBudget.spent - overBudget.limit)} over your {overBudget.cat} budget this cycle.</div>

      )}

        <div className="mb-section-head"><h2>Budgets this cycle</h2></div>
        <div className="mb-ledger-rule" />
        {budgets.map(b => {
          const pct = Math.min(100, (b.spent / b.limit) * 100);
          const color = b.spent > b.limit ? 'var(--coral)' : pct > 70 ? 'var(--brass)' : 'var(--teal)';
          return (
            <div key={b.cat} className="mb-mb-16">
              <div className="mb-flex" style={{ justifyContent: 'space-between', fontSize: 12.5, marginBottom: 6 }}>
                <span className="mb-flex mb-gap-8"><CategoryDot cat={b.cat} />{b.cat}</span>
                <span className="mb-muted num">{money(b.spent)} of {money(b.limit)}</span>
              </div>
              <div className="mb-progress"><div className="mb-progress-fill" style={{ width: pct + '%', background: color }} /></div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function StatementsPage() {
  function download(doc) {
    const content = 'Meridian Bank\n' + doc.label + '\nAccount: ' + doc.account + '\nIssued: ' + doc.date + '\n\nThis is a simulated document for demo purposes.';
    const blob = new Blob([content], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = doc.label.replace(/\s+/g, '-') + '.txt'; a.click();
    URL.revokeObjectURL(url);
  }
  return (
    <div>
      <div className="mb-section-head mb-mb-16"><h2 style={{ fontSize: 20 }}>Statements & documents</h2></div>

  }

  function updateBalance(accountId, delta) {
    setAccounts(prev => prev.map(a => a.id === accountId ? { ...a, balance: a.balance + delta } : a));
  }

  function doTransfer(fromId, toId, amount, memo) {
    updateBalance(fromId, -amount);
    updateBalance(toId, amount);
    const fromName = accounts.find(a => a.id === fromId)?.name;
    const toName = accounts.find(a => a.id === toId)?.name;
    const today = new Date().toISOString().slice(0, 10);
    setTransactions(prev => [
      { id: uid(), date: today, merchant: 'Transfer to ' + toName, category: 'Transfer', accountId: fromId, amount: -amount, status: 'posted' },
      { id: uid(), date: today, merchant: 'Transfer from ' + fromName, category: 'Transfer', accountId: toId, amount: amount, status: 'posted' },
      ...prev,
    ]);
    addToast('Transferred ' + money(amount) + ' to ' + toName + '.');
  }

  function doP2P(fromId, recipient, amount, memo) {
    updateBalance(fromId, -amount);
    const today = new Date().toISOString().slice(0, 10);
    setTransactions(prev => [{ id: uid(), date: today, merchant: 'Sent to ' + recipient, category: 'Transfer', accountId: fromId, amount: -amount, status: 'posted' }, ...prev]);
    addToast('Sent ' + money(amount) + ' to ' + recipient + '.');
  }

  function toggleFreeze(cardId) {
    setCards(prev => prev.map(c => c.id === cardId ? { ...c, frozen: !c.frozen } : c));
    const card = cards.find(c => c.id === cardId);
    addToast(card && !card.frozen ? 'Card frozen.' : 'Card unfrozen.');
  }

  function toggleAutopay(payeeId) {
    setPayees(prev => prev.map(p => p.id === payeeId ? { ...p, autopay: !p.autopay } : p));
  }

  function payNow(payeeId, fromAccountId, amount) {
    const payee = payees.find(p => p.id === payeeId);
    if (!payee || !amount || amount <= 0) return;
    updateBalance(fromAccountId, -amount);
    const today = new Date().toISOString().slice(0, 10);
    setTransactions(prev => [{ id: uid(), date: today, merchant: payee.name, category: payee.category, accountId: fromAccountId, amount: -amount, status: 'posted' }, ...prev]);
    addToast('Paid ' + money(amount) + ' to ' + payee.name + '.');
  }

  function addPayee(name, category) {
    setPayees(prev => [...prev, { id: uid(), name, category, avgAmount: 0, nextDue: new Date().toISOString().slice(0, 10), autopay: false }]);
    addToast('Payee added.');
  }

  function goPage(p) { setPage(p); setMobilePage(p); setAvatarOpen(false); setNotifOpen(false); }

  if (!loggedIn) {
    return (
      <div className="mb-app" data-theme={theme}>
        <style>{STYLES}</style>
        {authView === 'home'
          ? <HomePage onSignIn={() => setAuthView('login')} />
          : <LoginPage onLogin={() => setLoggedIn(true)} onBack={() => setAuthView('home')} />}
      </div>
    );
  }

  const pageTitles = {
    dashboard: ['Dashboard', 'Your full financial picture, at a glance'],
    accounts: ['Accounts', 'Balances, numbers, and account details'],
    transactions: ['Transactions', 'Search and review your activity'],
    transfers: ['Transfers', 'Move money between accounts or to others'],
    cards: ['Cards', 'Manage your debit and credit cards'],
    billpay: ['Bill Pay', 'Payees, autopay, and one-time payments'],
    budget: ['Budget', 'Spending by category and trends over time'],
    statements: ['Statements', 'Monthly statements and tax documents'],
    support: ['Support', 'Help center and secure messaging'],
    settings: ['Settings', 'Profile, security, and preferences'],
  };

  return (
    <div className="mb-app" data-theme={theme}>
      <style>{STYLES}</style>
      <div className="mb-shell">
        <aside className="mb-sidebar">
          <div className="mb-brand">
            <div className="mb-brand-mark">M</div>
            <div>
              <div className="mb-brand-name">Meridian</div>
              <div className="mb-brand-sub">Private Banking</div>
            </div>
          </div>
          <nav className="mb-nav">
            {NAV_ITEMS.map(item => {
              const Icon = item.icon;
              return (
                <button key={item.id} className={'mb-nav-item' + (page === item.id ? ' active' : '')} onClick={() => goPage(item.id)} type="button">
                  <Icon size={17} /> {item.label}
                </button>
              );
            })}
          </nav>
          <div className="mb-sidebar-foot">
            <div className="mb-theme-toggle">
              <span>{theme === 'dark' ? 'Dark mode' : 'Light mode'}</span>
              <Switch on={theme === 'dark'} onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} />
            </div>
            <button className="mb-logout" onClick={() => { setLoggedIn(false); setAuthView('home'); }} type="button"><LogOut size={15} /> Sign out</button>
          </div>
        </aside>

        <main className="mb-main">
          <div className="mb-topbar">
            <div>
              <div className="mb-topbar-title">{pageTitles[page][0]}</div>
              <div className="mb-topbar-sub">{pageTitles[page][1]}</div>
            </div>
            <div className="mb-topbar-right">
              <div style={{ position: 'relative' }}>
                <button className="mb-icon-btn" onClick={() => { setNotifOpen(!notifOpen); setAvatarOpen(false); }} type="button">
                  <Bell size={16} />
                  <span className="mb-dot-badge" />
                </button>
                {notifOpen && (
                  <div className="mb-card" style={{ position: 'absolute', right: 0, top: 46, width: 320, zIndex: 30, padding: 10 }}>
                    <div style={{ fontWeight: 600, fontSize: 13, padding: '4px 6px 10px' }}>Notifications</div>
                    {NOTIFICATIONS.map(n => {
                      const Icon = n.icon;
                      return (
                        <div key={n.id} className="mb-flex mb-gap-12" style={{ alignItems: 'flex-start', padding: '9px 6px', borderTop: '1px solid var(--hairline)' }}>
                          <Icon size={15} color="var(--brass-bright)" style={{ marginTop: 2, flexShrink: 0 }} />
                          <div>
                            <div style={{ fontSize: 12.5, fontWeight: 600 }}>{n.title}</div>
                            <div className="mb-muted" style={{ fontSize: 11.5, marginTop: 1 }}>{n.body}</div>
                            <div className="mb-muted" style={{ fontSize: 10.5, marginTop: 3 }}>{n.time}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
              <div style={{ position: 'relative' }}>
                <button className="mb-avatar" onClick={() => { setAvatarOpen(!avatarOpen); setNotifOpen(false); }} type="button">
                  {profile.name.split(' ').map(n => n[0]).join('')}
                </button>
                {avatarOpen && (
                  <div className="mb-card" style={{ position: 'absolute', right: 0, top: 46, width: 200, zIndex: 30, padding: 8 }}>
                    <div style={{ padding: '8px 10px' }}>
                      <div style={{ fontWeight: 600, fontSize: 13 }}>{profile.name}</div>
                      <div className="mb-muted" style={{ fontSize: 11.5 }}>{profile.email}</div>
                    </div>
                    <button className="mb-nav-item" onClick={() => goPage('settings')} type="button"><User size={15} /> Profile & settings</button>
                    <button className="mb-nav-item" onClick={() => { setLoggedIn(false); setAuthView('home'); }} type="button"><LogOut size={15} /> Sign out</button>
                  </div>
                )}
              </div>
            </div>
          </div>

          <div className="mb-content">
            {page === 'dashboard' && <Dashboard accounts={accounts} transactions={transactions} hide={hide} setHide={setHide} setPage={goPage} setModal={setModal} name={profile.name} goals={goals} creditScore={creditScore} />}
            {page === 'accounts' && <AccountsPage accounts={accounts} transactions={transactions} hide={hide} setPage={goPage} setTxFilter={setTxFilter} />}
            {page === 'transactions' && <TransactionsPage transactions={transactions} accounts={accounts} initialFilter={txFilter} />}
            {page === 'transfers' && <TransfersPage accounts={accounts} doTransfer={doTransfer} doP2P={doP2P} />}
            {page === 'cards' && <CardsPage cards={cards} accounts={accounts} toggleFreeze={toggleFreeze} setModal={setModal} />}
            {page === 'billpay' && <BillPayPage payees={payees} accounts={accounts} toggleAutopay={toggleAutopay} payNow={payNow} addPayee={addPayee} />}
            {page === 'budget' && <BudgetPage transactions={transactions} />}
            {page === 'statements' && <StatementsPage />}
            {page === 'support' && <SupportPage addToast={addToast} />}
            {page === 'settings' && <SettingsPage profile={profile} setProfile={setProfile} theme={theme} setTheme={setTheme} addToast={addToast} />}
          </div>
        </main>
      </div>

      <div className="mb-mobile-nav">
        {NAV_ITEMS.slice(0, 5).map(item => {
          const Icon = item.icon;
          return (
            <button key={item.id} className={mobilePage === item.id ? 'active' : ''} onClick={() => goPage(item.id)} type="button">
              <Icon size={18} /> {item.label}
            </button>
          );
        })}
      </div>

      {modal === 'deposit' && (
        <Modal title="Deposit a check" onClose={() => setModal(null)}>
          <div style={{ textAlign: 'center', padding: '10px 0' }}>
            <div className="mb-muted" style={{ fontSize: 13, marginBottom: 18 }}>Mobile check deposit uses your camera to capture the front and back of a check. This is simulated in the demo.</div>
            <button className="mb-btn mb-btn-primary block" onClick={() => { setModal(null); addToast('Check deposit simulated — funds available in 1-2 business days.'); }} type="button">Simulate deposit</button>
          </div>
        </Modal>
      )}
      {modal && modal.type === 'lost' && (
        <Modal title="Report card lost or stolen" onClose={() => setModal(null)}>
          <div className="mb-muted" style={{ fontSize: 13, marginBottom: 18 }}>We'll immediately lock •••• {modal.card.last4} and overnight a replacement card, free of charge.</div>
          <button className="mb-btn mb-btn-danger block" onClick={() => { toggleFreeze(modal.card.id); setModal(null); addToast('Card reported and locked. A replacement is on its way.'); }} type="button">Confirm report</button>
        </Modal>
      )}

      <Toasts toasts={toasts} />
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<MeridianBank />);
</script>
</body>
</html>
